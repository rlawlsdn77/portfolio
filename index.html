<!doctype html>

<title>김진우 · 포트폴리오</title>
<!-- 맨 위 포트폴리오 페이지 — "한 페이지 케이스 스터디"(2026-11-26~). 실무형 다크: 어두운 바탕 · 초록 강조 1색 · 본문 Pretendard, 픽셀 글꼴은 작은 라벨에만.
     순서: 첫 화면(이름·직무·한 줄 정체성·연락 버튼 + 프로젝트 카드 = 한눈에 보기) → 01 자기소개 · 기술 스택 → 프로젝트마다 케이스 스터디 → 연락처.
     프로젝트 케이스 스터디(탭·넘김 없이 모두 펼침): 소개(대표 화면 · 개발 의도 · 장르·기간·인원·환경·내 역할 · 링크) → 핵심 기능(무엇 · 구현 방법 · 선택 이유 + 화면)
       → 문제 해결(문제 → 원인 → 해결 → 결과 · 배운 점) → 결과와 회고(이룬 것 · 아쉬운 점 · 다음에는 + 화면 모음).
     내용은 모두 data/portfolio.json · data/projects/*.json 값 그대로(지어내지 않음). UI 문구 일부는 theme/strings.tsv(문구 표)에서, 이 페이지 전용 라벨(핵심 기능·선택 이유 …)은 이 파일에 적혀 있음.
     [포트폴리오 PDF]는 제출용 원본 포트폴리오 문서(print.html, A4)를 보이지 않는 틀에 불러 그 문서의 인쇄 창을 띄움(실패하면 새 탭으로).
     예전 레트로 게임풍 페이지는 retro.html(2026-11-26까지 맨 위 index.html). 배치 원칙: theme/layout-principles.md
     점검: PFPage.whenReady() → PFPage.report() { errors, sections, images.broken, overflowX } · ?pf-audit=1이면 #pf-audit에 report()의 base64 JSON(headless용)
     설치·빌드 없음: React·Babel·Tailwind 없이 순수 HTML/CSS/JS(외부는 글꼴만) -->
<!-- 링크 미리보기(메신저·메일·검색): 미리보기 봇은 스크립트를 돌리지 않아 data/를 못 읽으므로 여기만 글을 적어 둠.
     profile.md의 이름·직무·한 줄 정체성을 바꾸면 이 줄들도 같이 바꿈. og:image는 배포 주소(GitHub Pages) 기준 절대 주소여야 함 -->
<meta name="description" content="김진우 · Unity 게임 클라이언트 프로그래머 포트폴리오 — 좋은 플레이 경험은 감이 아니라 데이터로 다듬습니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="김진우 · Unity 게임 클라이언트 프로그래머 포트폴리오">
<meta property="og:description" content="좋은 플레이 경험은 감이 아니라 데이터로 다듬습니다. 프로젝트 3개(SHIFTER · 시장에 가면 · OverFixed!)">
<meta property="og:image" content="https://rlawlsdn77.github.io/portfolio/src/Shifter/images/01_cover.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  :root {
    --bg: #0B0F0D;
    --ink: #E9EEE6;
    --acc: #7BE38F;
    --body: rgba(233, 238, 230, .84);
    --muted: rgba(233, 238, 230, .62);
    --line: rgba(233, 238, 230, .10);
    --line2: rgba(233, 238, 230, .18);
    --surface: rgba(233, 238, 230, .035);
    --surface2: rgba(233, 238, 230, .06);
    --acc-soft: color-mix(in srgb, var(--acc) 12%, transparent);
    --acc-line: color-mix(in srgb, var(--acc) 42%, transparent);
    --acc-ink: color-mix(in srgb, var(--acc) 88%, var(--ink));
    --sans: 'Pretendard Variable', Pretendard, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --pixel: 'Galmuri11', 'Pretendard Variable', Pretendard, system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Consolas, 'D2Coding', monospace;
    --r: 14px;
    --top-h: 60px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: calc(var(--top-h) + 16px); -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.7;
         -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word; overflow-x: hidden; }
  h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
  ul, ol { padding: 0; list-style: none; }
  img { display: block; max-width: 100%; height: auto; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  ::selection { background: var(--acc); color: var(--bg); }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; border-radius: 4px; }
  code { font-family: var(--mono); font-size: .88em; padding: .08em .38em; border-radius: 5px; background: rgba(233, 238, 230, .08); color: var(--ink); word-break: break-word; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }
  @media (min-width: 760px) { .wrap { padding: 0 40px; } }
  .skip { position: absolute; left: 12px; top: -60px; z-index: 100; padding: 8px 14px; border-radius: 8px; background: var(--acc); color: var(--bg); font-weight: 700; text-decoration: none; }
  .skip:focus { top: 12px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* 작은 라벨(픽셀 글꼴 포인트) */
  .eyebrow { font-family: var(--pixel); font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--acc); }
  .eyebrow .m { color: var(--muted); font-weight: 400; letter-spacing: 0; margin-left: 8px; }

  /* 버튼 */
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line2);
         background: var(--surface); color: var(--ink); font-size: 14.5px; font-weight: 700; text-decoration: none; white-space: nowrap; cursor: pointer;
         transition: border-color .15s, background-color .15s, color .15s; }
  .btn:hover { border-color: var(--acc-line); color: var(--acc); }
  .btn.pri { background: var(--acc); border-color: var(--acc); color: var(--bg); }
  .btn.pri:hover { filter: brightness(1.07); color: var(--bg); }
  .btn.sm { min-height: 36px; padding: 0 13px; font-size: 13px; border-radius: 9px; }
  .btn[disabled] { opacity: .55; cursor: progress; }
  .ext { font-weight: 400; opacity: .8; }
  .tl { color: var(--acc-ink); font-size: 14px; font-weight: 700; text-decoration: none; }
  .tl:hover { text-decoration: underline; text-underline-offset: 3px; }
  .chip { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px; background: var(--acc-soft); color: var(--acc-ink);
          font-size: 12.5px; font-weight: 700; text-decoration: none; white-space: nowrap; vertical-align: 1px; }
  a.chip:hover { background: var(--acc); color: var(--bg); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags li { padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line2); font-size: 12.5px; font-weight: 600; color: var(--body); }

  /* 머리 막대 */
  .top { position: sticky; top: 0; z-index: 40; height: var(--top-h); border-bottom: 1px solid var(--line); background: rgba(11, 15, 13, .88);
         -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .top-in { display: flex; align-items: center; gap: 20px; height: 100%; }
  .brand { display: flex; flex-direction: column; min-width: 0; text-decoration: none; line-height: 1.3; }
  .brand b { font-size: 15px; }
  .brand span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tnav { display: none; margin-left: auto; gap: 4px; }
  .tnav a { padding: 6px 10px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .tnav a:hover { color: var(--ink); background: var(--surface2); }
  .tnav a.on { color: var(--ink); background: var(--surface2); box-shadow: inset 0 -2px 0 var(--acc); }
  .top .btn { margin-left: auto; }
  @media (min-width: 960px) { .tnav { display: flex; } .top .btn { margin-left: 8px; } }

  /* 첫 화면 */
  .hero { padding: 40px 0 64px; border-bottom: 1px solid var(--line);
          background: radial-gradient(60% 70% at 85% 0%, color-mix(in srgb, var(--acc) 9%, transparent), transparent 70%); }
  .hero h1 { margin-top: 18px; font-size: clamp(40px, 6vw, 64px); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .hero h1 .en { display: block; margin-top: 8px; font-family: var(--pixel); font-size: clamp(13px, 1.6vw, 16px); font-weight: 700; letter-spacing: .14em; color: var(--muted); }
  .hero .job { margin-top: 14px; font-size: clamp(17px, 2vw, 20px); font-weight: 700; color: var(--acc-ink); }
  .hero .headline { margin-top: 18px; max-width: 30em; font-size: clamp(22px, 3vw, 32px); font-weight: 800; line-height: 1.45; letter-spacing: -.01em; text-wrap: balance; }
  .cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 22px; font-size: 14px; color: var(--muted); }
  .facts b { color: var(--ink); font-weight: 700; }
  .glance-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-top: 40px; }
  .glance-h h2 { font-size: 20px; font-weight: 800; }
  .glance-h p { font-size: 13.5px; color: var(--muted); }
  .pcards { display: grid; gap: 18px; margin-top: 16px; }
  @media (min-width: 760px) { .pcards { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); } }
  .pcard { display: flex; flex-direction: column; height: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
           text-decoration: none; transition: border-color .15s, transform .15s; }
  .pcard:hover { border-color: var(--acc-line); transform: translateY(-2px); }
  .pcard .th { aspect-ratio: 2 / 1; overflow: hidden; background: #000; border-bottom: 1px solid var(--line); }
  /* 낮은 노트북 화면(1280×800 · 1366×768): 첫 화면에 카드 제목까지 들어오게 간격만 줄임 */
  @media (min-width: 760px) and (max-height: 880px) {
    .hero { padding-top: 30px; }
    .hero h1 { margin-top: 12px; font-size: clamp(40px, 5vw, 56px); }
    .hero .job { margin-top: 10px; }
    .hero .headline { margin-top: 12px; }
    .cta { margin-top: 20px; }
    .facts { margin-top: 14px; }
    .glance-h { margin-top: 28px; }
  }
  .pcard .th img { width: 100%; height: 100%; object-fit: cover; }
  .pcard .bd { display: flex; flex-direction: column; flex: 1; gap: 10px; padding: 18px 18px 20px; }
  .pcard .k { font-family: var(--pixel); font-size: 12px; font-weight: 700; color: var(--acc); }
  .pcard .k .m { margin-left: 6px; color: var(--muted); font-weight: 400; }
  .pcard h3 { font-size: 21px; font-weight: 800; line-height: 1.3; }
  .pcard .tg { font-size: 14.5px; line-height: 1.6; color: var(--body); }
  .pcard dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin-top: auto; padding-top: 12px; border-top: 1px dashed var(--line2); font-size: 13.5px; }
  .pcard dt { color: var(--muted); font-weight: 600; }
  .pcard dd { color: var(--ink); }
  .pcard .go { font-size: 13.5px; font-weight: 700; color: var(--acc-ink); }

  /* 절 공통 */
  .sec { padding: 80px 0; border-bottom: 1px solid var(--line); }
  .sec-h h2 { margin-top: 10px; font-size: clamp(28px, 3.6vw, 38px); font-weight: 800; letter-spacing: -.015em; line-height: 1.25; }
  .sec-h .lead { margin-top: 12px; max-width: 46em; font-size: 17px; color: var(--body); }

  /* 자기소개 · 기술 스택 */
  .about { display: grid; gap: 28px; margin-top: 32px; }
  @media (min-width: 960px) { .about { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 40px; align-items: start; } }
  .intro { padding: 28px; border: 1px solid var(--line); border-left: 3px solid var(--acc); border-radius: var(--r); background: var(--surface); }
  .intro p { font-size: 18px; line-height: 1.8; }
  .intro p + p { margin-top: 12px; }
  .intro .who { margin-top: 22px; padding-top: 16px; border-top: 1px dashed var(--line2); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 14.5px; }
  .intro .who dt { color: var(--muted); font-weight: 600; }
  .intro .who a { color: var(--acc-ink); text-decoration: none; overflow-wrap: anywhere; }
  .intro .who a:hover { text-decoration: underline; }
  .skills { display: grid; gap: 14px; }
  .skill { padding: 20px 22px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
  .skill h3 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 18px; font-weight: 800; }
  .skill h3 small { flex: none; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .skill ul { margin-top: 10px; display: grid; gap: 8px; }
  .skill li { position: relative; padding-left: 16px; font-size: 14.5px; line-height: 1.65; color: var(--body); }
  .skill li::before { content: ''; position: absolute; left: 2px; top: .72em; width: 6px; height: 6px; border-radius: 2px; background: var(--acc); }
  .skill li .chip { margin-left: 6px; }

  /* 프로젝트 케이스 스터디 */
  .proj-h { display: grid; gap: 10px; }
  .proj-h h2 { font-size: clamp(34px, 5vw, 52px); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .proj-h .tagline { max-width: 44em; font-size: clamp(17px, 1.9vw, 19px); line-height: 1.65; color: var(--body); }
  /* 프로젝트 안 바로 가기(소개 아래 긴 내용으로 바로) */
  .ptoc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .ptoc a { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line2); font-size: 13px; font-weight: 700; color: var(--body); text-decoration: none; }
  .ptoc a:hover { border-color: var(--acc-line); color: var(--acc); }
  .ov { display: grid; gap: 28px; margin-top: 32px; }
  @media (min-width: 960px) { .ov { grid-template-columns: minmax(0, 11fr) minmax(0, 10fr); gap: 36px; align-items: start; } }
  .shot-btn { display: block; width: 100%; padding: 0; border: 0; background: transparent; cursor: zoom-in; text-align: left; }
  .cover { overflow: hidden; border: 1px solid var(--line); border-radius: var(--r); background: #000; }
  .cover img { width: 100%; }
  .intent { padding: 18px 20px; border-radius: 12px; background: var(--acc-soft); border: 1px solid var(--acc-line); }
  .intent .k, .meta dt, .kk { font-size: 12.5px; font-weight: 800; letter-spacing: .02em; color: var(--acc-ink); }
  .intent p + p { margin-top: 6px; font-size: 16px; line-height: 1.7; color: var(--ink); }
  .meta { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: row dense; gap: 14px 20px; margin-top: 20px; }
  .meta .wide { grid-column: 1 / -1; }
  .meta dd { margin-top: 2px; font-size: 15px; line-height: 1.6; }
  .ov .tags { margin-top: 20px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }

  .block { margin-top: 64px; }
  .bh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line2); }
  .bh h3 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .bh .n { font-family: var(--pixel); font-size: 13px; font-weight: 700; color: var(--acc); }
  .bh p { font-size: 14px; color: var(--muted); }

  .feats { display: grid; gap: 0; }
  .feat { display: grid; gap: 20px; padding: 30px 0; border-bottom: 1px solid var(--line); }
  .feat:last-child { border-bottom: 0; }
  @media (min-width: 960px) { .feat.has-img { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; align-items: start; } }
  .feat .fno { font-family: var(--pixel); font-size: 12px; font-weight: 700; color: var(--acc); }
  .feat h4 { margin-top: 6px; font-size: 21px; font-weight: 800; line-height: 1.4; }
  .feat .what { margin-top: 8px; font-size: 16px; line-height: 1.7; color: var(--body); }
  .fdl { display: grid; gap: 14px; margin-top: 18px; }
  @media (min-width: 960px) { .feat:not(.has-img) .fdl { grid-template-columns: 1fr 1fr; gap: 24px; } }
  .fdl dd { margin-top: 4px; font-size: 15px; line-height: 1.7; color: var(--body); }
  .fdl .why { padding: 14px 16px; border-radius: 10px; background: var(--surface2); border-left: 3px solid var(--acc); }
  .fdl .why dd { color: var(--ink); }
  .feat .more { margin-top: 14px; }
  .fig { overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #000; }
  .fig img { width: 100%; }
  .cap { margin-top: 8px; font-size: 13px; line-height: 1.55; color: var(--muted); }

  .ts-grid { display: grid; gap: 16px; margin-top: 24px; }
  @media (min-width: 960px) { .ts-grid.many { grid-template-columns: 1fr 1fr; } .ts-grid.many > .ts:last-child:nth-child(odd) { grid-column: 1 / -1; } }
  .ts { padding: 22px 24px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
  .ts .no { font-family: var(--pixel); font-size: 12px; font-weight: 700; color: var(--acc); }
  .ts h4 { margin-top: 6px; font-size: 18px; font-weight: 800; line-height: 1.45; }
  .ts dl { display: grid; gap: 12px; margin-top: 16px; }
  .ts dl > div { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; }
  .ts dt { padding-top: 2px; font-size: 13px; font-weight: 800; color: var(--muted); }
  .ts dd { font-size: 14.5px; line-height: 1.7; color: var(--body); }
  .ts .sol dt, .ts .res dt { color: var(--acc-ink); }
  .ts .res dd { color: var(--ink); }

  .retro { display: grid; gap: 16px; margin-top: 24px; }
  @media (min-width: 960px) { .retro { grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); } }
  .rcol { padding: 22px 24px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
  .rcol.ok { border-color: var(--acc-line); background: var(--acc-soft); }
  .rcol h4 { font-size: 16px; font-weight: 800; }
  .rcol ul { display: grid; gap: 10px; margin-top: 12px; }
  .rcol li { position: relative; padding-left: 18px; font-size: 14.5px; line-height: 1.7; color: var(--body); }
  .rcol li::before { content: '–'; position: absolute; left: 0; color: var(--muted); }
  .rcol.ok li::before { content: '✓'; color: var(--acc); font-weight: 800; }
  .rcol.ok li { color: var(--ink); }
  .shots-h { margin-top: 28px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
  .shots .shot-btn { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #000; aspect-ratio: 16 / 9; }
  .shots img { width: 100%; height: 100%; object-fit: cover; transition: transform .2s; }
  .shots .shot-btn:hover img { transform: scale(1.04); }
  .pnext { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 48px; padding-top: 20px; border-top: 1px dashed var(--line2); }

  /* 연락처 */
  .contact { border-bottom: 0; background: radial-gradient(60% 80% at 50% 120%, color-mix(in srgb, var(--acc) 10%, transparent), transparent 70%); }
  .ct { display: grid; gap: 32px; margin-top: 28px; }
  @media (min-width: 960px) { .ct { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; } }
  .ct .mail { display: inline-block; font-size: clamp(22px, 3vw, 30px); font-weight: 800; color: var(--acc-ink); text-decoration: none; overflow-wrap: anywhere; }
  .ct .mail:hover { text-decoration: underline; text-underline-offset: 5px; }
  .ct .gh { margin-top: 8px; font-size: 15px; }
  .ct .gh a { color: var(--body); }
  .plist { border-top: 1px solid var(--line); }
  .plist li { display: grid; gap: 4px 20px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  @media (min-width: 760px) { .plist li { grid-template-columns: minmax(0, 1fr) auto; align-items: center; } }
  .plist .t { font-size: 16px; font-weight: 800; text-decoration: none; }
  .plist .t:hover { color: var(--acc); }
  .plist .s { font-size: 13.5px; color: var(--muted); }
  .plist .l { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .foot { padding: 28px 0 40px; font-size: 13px; color: var(--muted); }
  .foot a { color: var(--muted); }

  /* 크게 보기 */
  .lbx { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 64px 72px; background: rgba(5, 7, 6, .94); }
  .lbx[hidden] { display: none; }
  .lbx figure { max-width: min(1180px, 100%); }
  .lbx img { max-height: calc(100vh - 190px); width: auto; margin: 0 auto; border-radius: 8px; }
  .lbx figcaption { margin-top: 12px; text-align: center; font-size: 14px; color: var(--body); }
  .lbx .x { position: absolute; top: 14px; right: 14px; }
  .lbx .nv { position: absolute; top: 50%; margin-top: -22px; width: 44px; justify-content: center; padding: 0; }
  .lbx .nv.l { left: 14px; } .lbx .nv.r { right: 14px; }
  @media (max-width: 759px) { .lbx { padding: 60px 12px 84px; } .lbx .nv { top: auto; bottom: 18px; margin-top: 0; } }
  body.lb-open { overflow: hidden; }

  .loading { padding: 120px 24px; text-align: center; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  @media print {
    .top, .cta, .links, .pnext, .lbx, .skip, .foot { display: none !important; }
    body { background: #fff; color: #111; }
  }
</style>
<link rel="stylesheet" href="theme/typeset.css"><!-- 줄바꿈 규칙(짧은 끝줄 막기): theme/layout-principles.md 원칙 2 -->
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<div id="app"><p class="loading">불러오는 중…</p></div>
<div class="lbx" id="lbx" hidden role="dialog" aria-modal="true" aria-label="크게 보기">
  <figure><img id="lbx-img" alt=""><figcaption id="lbx-cap"></figcaption></figure>
  <button type="button" class="btn sm x" id="lbx-x">닫기 <span class="ext">Esc</span></button>
  <button type="button" class="btn nv l" id="lbx-l" aria-label="이전 그림">◀</button>
  <button type="button" class="btn nv r" id="lbx-r" aria-label="다음 그림">▶</button>
</div>
<script>
(() => {
  // ── 문구 표(theme/strings.tsv): 맨 끝 "내 문구" 칸 → 없으면 기본 문구 ──
  const FALLBACK = {
    'name.portfolio': '포트폴리오', 'name.deck': '슬라이드', 'name.doc': '프로젝트 상세 문서', 'name.doc-short': '상세 문서', 'name.video': '시연 영상',
    'name.role': '내 역할', 'name.intent': '개발 의도', 'name.team': '팀 프로젝트', 'name.solo': '개인 프로젝트',
    'page.updated': '업데이트 {date}', 'page.intro': '자기소개', 'page.stack': '기술 스택', 'page.stack-note': '근거 프로젝트와 함께',
    'label.problem': '문제', 'label.cause': '원인', 'label.solution': '해결', 'label.result': '결과', 'label.lesson': '배운 점',
  };
  async function loadStrings() {
    const table = { ...FALLBACK };
    try {
      const r = await fetch('theme/strings.tsv', { cache: 'no-cache' });
      if (r.ok) {
        for (const line of (await r.text()).replace(/^﻿/, '').split(/\r?\n/)) {
          if (!line || line.startsWith('#')) continue;
          const c = line.split('\t');
          if (c.length < 3 || c[0] === '키') continue;
          table[c[0].trim()] = (c[3] || '').trim() || c[2].trim();
        }
      }
    } catch (e) { /* 표가 없으면 기본 문구 */ }
    const resolve = (k, d = 0) => String(table[k] ?? '').replace(/\{([a-z0-9-]+\.[a-z0-9-]+)\}/g, (m, ref) => (d > 4 ? m : resolve(ref, d + 1)));
    return (k, vars = {}) => resolve(k).replace(/\{([a-z0-9-]+)\}/g, (m, v) => (v in vars ? vars[v] : m));
  }

  // ── 작은 도우미 ──
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rich = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');           // 데이터의 `코드`만 코드로
  const plain = (s) => String(s ?? '').replace(/`/g, '');
  const pad = (n) => String(n).padStart(2, '0');
  const isUrl = (u) => /^https?:\/\//.test(u || '');
  const shortUrl = (u) => String(u || '').replace(/^https?:\/\//, '').replace(/\/$/, '');
  const srcOf = (p, src) => `src/${p.id}/${src}`;
  const deckUrl = (p, sid = '') => `project.html?p=${encodeURIComponent(p.id)}${sid ? `#s=${sid}` : ''}`;
  const docUrl = (p) => `doc.html?p=${encodeURIComponent(p.id)}`;
  const metaOf = (p, re) => ((p.meta || []).find((m) => re.test(m.label || '')) || {}).value || '';
  const EXT = '<span class="ext" aria-hidden="true">↗</span>';
  const NEWTAB = '<span class="sr">(새 탭)</span>';
  const out = (href, label, cls = 'btn') => `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener">${label} ${EXT}${NEWTAB}</a>`;
  // 기능 절(section) → 슬라이드 장면 id (원본 포트폴리오 문서와 같은 규칙)
  const norm = (s) => String(s || '').replace(/[`*_~]/g, '').replace(/\s+/g, ' ').trim();
  const keyOk = (k) => /^[a-z][a-z0-9-]{1,31}$/.test(k || '') && !/^s-\d+$/.test(k);
  function deckScene(p, section) {
    const want = norm(section);
    if (!want || !p.deck?.slides?.length) return '';
    const last = (x) => norm((x.sectionPath || []).slice(-1)[0]);
    const find = (list) => list.find((x) => last(x) === want) || list.find((x) => (x.sectionPath || []).some((s) => norm(s) === want));
    const sl = find(p.deck.slides);
    if (sl) return keyOk(sl.key) ? `d-${sl.key}` : '';
    const hid = find(p.deck.base || []);
    return hid && keyOk(hid.chapter) && p.deck.slides.some((x) => x.chapter === hid.chapter) ? `ch-${hid.chapter}` : '';
  }

  // ── 크게 보기(그림 모음마다 ◀ ▶) ──
  const gallery = new Map();   // 모음 이름 → [{src, cap}]
  const addShot = (group, src, cap) => { if (!gallery.has(group)) gallery.set(group, []); gallery.get(group).push({ src, cap }); return gallery.get(group).length - 1; };
  const shotBtn = (group, src, cap, inner) => `<button type="button" class="shot-btn" data-g="${esc(group)}" data-i="${addShot(group, src, cap)}" aria-label="크게 보기: ${esc(plain(cap))}">${inner}</button>`;
  const lbx = { el: null, g: '', i: 0, back: null };
  function openLbx(g, i) {
    const items = gallery.get(g); if (!items?.length) return;
    lbx.g = g; lbx.i = (i + items.length) % items.length; lbx.back = lbx.back || document.activeElement;
    const it = items[lbx.i];
    const im = document.getElementById('lbx-img');
    im.src = it.src; im.alt = plain(it.cap);
    document.getElementById('lbx-cap').innerHTML = `${items.length > 1 ? `<span class="eyebrow">${pad(lbx.i + 1)} / ${pad(items.length)}</span> ` : ''}${rich(it.cap)}`;
    document.getElementById('lbx-l').hidden = document.getElementById('lbx-r').hidden = items.length < 2;
    const el = document.getElementById('lbx');
    if (el.hidden) { el.hidden = false; document.body.classList.add('lb-open'); document.getElementById('lbx-x').focus(); }
  }
  function closeLbx() {
    const el = document.getElementById('lbx'); if (el.hidden) return;
    el.hidden = true; document.body.classList.remove('lb-open');
    lbx.back?.focus?.({ preventScroll: true }); lbx.back = null;
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest?.('.shot-btn'); if (b) { openLbx(b.dataset.g, +b.dataset.i); return; }
    if (e.target.id === 'lbx') closeLbx();
  });
  document.getElementById('lbx-x').addEventListener('click', closeLbx);
  document.getElementById('lbx-l').addEventListener('click', () => openLbx(lbx.g, lbx.i - 1));
  document.getElementById('lbx-r').addEventListener('click', () => openLbx(lbx.g, lbx.i + 1));
  addEventListener('keydown', (e) => {
    if (document.getElementById('lbx').hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); closeLbx(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); openLbx(lbx.g, lbx.i + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); openLbx(lbx.g, lbx.i - 1); }
  });

  // ── [포트폴리오 PDF]: 제출용 원본 포트폴리오 문서(print.html, A4)를 보이지 않는 틀에 불러 인쇄 창을 띄움 ──
  const waitMax = (p, ms) => Promise.race([p, new Promise((r) => setTimeout(r, ms))]);
  let printFrame = null;
  async function printOriginal() {
    if (!printFrame) {
      const f = document.createElement('iframe');
      f.title = '인쇄용 포트폴리오 문서'; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true');
      Object.assign(f.style, { position: 'fixed', left: '-12000px', top: '0', width: '1200px', height: '900px', border: '0' });
      const loaded = new Promise((res, rej) => { f.onload = res; f.onerror = rej; });
      f.src = 'print.html';
      document.body.appendChild(f);
      await waitMax(loaded, 20000);
      printFrame = f;
    }
    const w = printFrame.contentWindow;
    if (!w || !w.PFPage) { printFrame.remove(); printFrame = null; throw new Error('원본 포트폴리오 문서를 불러오지 못했습니다'); }
    await waitMax(w.PFPage.whenReady(), 15000);
    const imgs = [...w.document.images];
    imgs.forEach((i) => { i.loading = 'eager'; });
    await waitMax(Promise.all(imgs.map((i) => (i.complete ? null : new Promise((r) => { i.addEventListener('load', r, { once: true }); i.addEventListener('error', r, { once: true }); })))), 15000);
    try { await waitMax(w.document.fonts.ready, 5000); } catch (e) { /* 글꼴 대기 실패는 무시 */ }
    w.focus(); w.print();
  }
  document.addEventListener('click', async (e) => {
    const b = e.target.closest?.('[data-pdf]'); if (!b || b.disabled) return;
    const label = b.innerHTML; b.disabled = true; b.textContent = '준비 중…';
    try { await printOriginal(); }
    catch (err) { console.warn('[index] 인쇄 창을 띄우지 못해 원본 포트폴리오 문서를 새 탭으로 엽니다:', err); window.open('print.html', '_blank', 'noopener'); }
    finally { b.disabled = false; b.innerHTML = label; }
  });

  // ── 그리기 ──
  const info = { errors: [] };
  let resolveReady; const ready = new Promise((r) => { resolveReady = r; });
  window.PFPage = {
    whenReady: () => ready,
    report: () => ({
      errors: info.errors.slice(),
      sections: [...document.querySelectorAll('main > section[id]')].map((s) => s.id),
      images: { total: document.images.length, broken: [...document.images].filter((i) => i.complete && i.getAttribute('src') && i.naturalWidth === 0).map((i) => i.getAttribute('src')) },
      overflowX: Math.max(0, document.documentElement.scrollWidth - document.documentElement.clientWidth),
    }),
  };

  function hero(pf, prof, projects, t) {
    const solo = projects.filter((p) => p.team?.type !== 'team').length, team = projects.length - solo;
    const cards = projects.map((p, i) => {
      const who = metaOf(p, /인원/) || (p.team?.type === 'team' ? t('name.team') : t('name.solo'));
      const rows = [['장르', metaOf(p, /장르/)], ['기간', metaOf(p, /기간/)], ['인원', who]].filter((r) => r[1]);
      return `<li><a class="pcard" href="#p-${esc(p.id)}">
        <div class="th">${p.cover ? `<img src="${esc(srcOf(p, p.cover))}" alt="${esc(p.title)} 대표 화면" decoding="async">` : ''}</div>
        <div class="bd">
          <p class="k">PROJECT ${pad(i + 1)}<span class="m">${esc(p.team?.type === 'team' ? t('name.team') : t('name.solo'))}</span></p>
          <h3>${esc(p.title)}</h3>
          ${p.tagline ? `<p class="tg">${rich(p.tagline)}</p>` : ''}
          <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
          <span class="go">자세히 보기 ↓</span>
        </div></a></li>`;
    }).join('');
    return `<section id="top" class="hero"><div class="wrap">
      <p class="eyebrow">PORTFOLIO${pf.generatedAt ? `<span class="m">${esc(t('page.updated', { date: pf.generatedAt }))}</span>` : ''}</p>
      <h1>${esc(prof.name)}${prof.nameEn ? `<span class="en">${esc(prof.nameEn.toUpperCase())}</span>` : ''}</h1>
      ${prof.job ? `<p class="job">${esc(prof.job)}</p>` : ''}
      ${prof.headline ? `<p class="headline">${rich(prof.headline)}</p>` : ''}
      <div class="cta">
        ${prof.email ? `<a class="btn pri" href="mailto:${esc(prof.email)}">메일 보내기</a>` : ''}
        ${isUrl(prof.github) ? out(prof.github, 'GitHub') : ''}
        <button type="button" class="btn" data-pdf title="제출용 포트폴리오 문서(A4)를 PDF로 저장">${esc(t('name.portfolio'))} PDF</button>
      </div>
      <p class="facts"><span>프로젝트 <b>${projects.length}개</b>${projects.length ? ` (${[solo && `개인 ${solo}`, team && `팀 ${team}`].filter(Boolean).join(' · ')})` : ''}</span>
        ${(pf.skills || []).length ? `<span>${esc(t('page.stack'))} <b>${pf.skills.map((s) => esc(s.name)).join(' · ')}</b></span>` : ''}</p>
      ${projects.length ? `<div class="glance-h"><h2>프로젝트 한눈에 보기</h2><p>카드를 누르면 그 프로젝트의 소개 · 핵심 기능 · 문제 해결 · 회고로 이동합니다</p></div>
      <ul class="pcards">${cards}</ul>` : ''}
    </div></section>`;
  }

  function about(pf, prof, byId, t) {
    const skills = (pf.skills || []).map((s) => {
      const ev = s.evidence || [];
      const n = new Set(ev.map((e) => e.project).filter(Boolean)).size;
      return `<article class="skill"><h3>${esc(s.name)}${n ? `<small>근거 프로젝트 ${n}개</small>` : ''}</h3>
        <ul>${ev.map((e) => `<li>${rich(e.text)}${byId[e.project] ? `<a class="chip" href="#p-${esc(e.project)}">${esc(byId[e.project].title)}</a>` : ''}</li>`).join('')}</ul></article>`;
    }).join('');
    if (!prof.intro && !skills) return '';
    return `<section id="about" class="sec"><div class="wrap">
      <header class="sec-h"><p class="eyebrow">ABOUT</p><h2>${esc(t('page.intro'))} · ${esc(t('page.stack'))}</h2></header>
      <div class="about">
        <div class="intro">
          ${(prof.intro || '').split(/\n+/).filter((l) => l.trim()).map((l) => `<p>${rich(l)}</p>`).join('')}
          <dl class="who">
            ${prof.email ? `<dt>이메일</dt><dd><a href="mailto:${esc(prof.email)}">${esc(prof.email)}</a></dd>` : ''}
            ${isUrl(prof.github) ? `<dt>GitHub</dt><dd><a href="${esc(prof.github)}" target="_blank" rel="noopener">${esc(shortUrl(prof.github))} ↗${NEWTAB}</a></dd>` : ''}
          </dl>
        </div>
        ${skills ? `<div><p class="kk" style="margin-bottom:12px">${esc(t('page.stack'))} — ${esc(t('page.stack-note'))}</p><div class="skills">${skills}</div></div>` : ''}
      </div>
    </div></section>`;
  }

  function project(p, i, projects, t) {
    const g = `p-${p.id}`;
    const meta = (p.meta || []).filter((m) => m.value);
    const role = p.team?.role;
    const L = p.links || {};
    const links = [
      isUrl(L.video) && out(L.video, `▶ ${esc(t('name.video'))}`, 'btn pri'),
      out(docUrl(p), esc(t('name.doc'))),
      out(deckUrl(p), esc(t('name.deck'))),
      isUrl(L.github) && out(L.github, 'GitHub'),
      ...(L.extra || []).filter((l) => isUrl(l.url)).map((l) => out(l.url, esc(l.label))),
    ].filter(Boolean).join('');
    const ov = `<div class="ov">
      <div>${p.cover ? `<div class="cover">${shotBtn(g + '-cover', srcOf(p, p.cover), `${p.title} 대표 화면`, `<img src="${esc(srcOf(p, p.cover))}" alt="${esc(p.title)} 대표 화면" loading="lazy" decoding="async">`)}</div>` : ''}</div>
      <div>
        ${p.intent?.text ? `<div class="intent"><p class="k">${esc(t('name.intent'))}</p><p>${rich(p.intent.text)}</p></div>` : ''}
        ${(meta.length || role) ? `<dl class="meta">${meta.map((m) => `<div${String(m.value).length > 24 ? ' class="wide"' : ''}><dt>${esc(m.label)}</dt><dd>${rich(m.value)}</dd></div>`).join('')}
          ${role ? `<div class="wide"><dt>${esc(t('name.role'))}</dt><dd>${rich(role)}</dd></div>` : ''}</dl>` : ''}
        ${(p.tags || []).length ? `<ul class="tags">${p.tags.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        <div class="links">${links}</div>
      </div>
    </div>`;

    const hl = p.highlights || [];
    const feats = hl.length ? `<div class="block" id="${esc(g)}-feat">
      <div class="bh"><span class="n">01</span><h3>핵심 기능</h3><p>무엇을 · 어떻게 · 왜 그렇게 만들었는지</p></div>
      <ol class="feats">${hl.map((h, k) => {
        const im = h.image?.src;
        const sid = deckScene(p, h.section);
        const cap = (typeof h.image?.caption === 'string' ? h.image.caption : h.image?.caption?.text) || h.title;
        return `<li class="feat${im ? ' has-img' : ''}">
          <div>
            <p class="fno">기능 ${pad(k + 1)}</p>
            <h4>${rich(h.title)}</h4>
            ${h.what ? `<p class="what">${rich(h.what)}</p>` : ''}
            ${(h.how || h.why) ? `<dl class="fdl">
              ${h.how ? `<div><dt class="kk">구현 방법</dt><dd>${rich(h.how)}</dd></div>` : ''}
              ${h.why ? `<div class="why"><dt class="kk">선택 이유</dt><dd>${rich(h.why)}</dd></div>` : ''}
            </dl>` : ''}
            <p class="more">${out(deckUrl(p, sid), `${esc(t('name.deck'))}에서 자세히`, 'tl')}</p>
          </div>
          ${im ? `<figure>${shotBtn(g + '-feat', srcOf(p, im), cap, `<div class="fig"><img src="${esc(srcOf(p, im))}" alt="${esc(plain(cap))}" loading="lazy" decoding="async"${h.image.w && h.image.h ? ` width="${h.image.w}" height="${h.image.h}"` : ''}></div>`)}
            <figcaption class="cap">${rich(cap)}</figcaption></figure>` : ''}
        </li>`;
      }).join('')}</ol></div>` : '';

    const ts = p.troubleshooting || [];
    const tsHtml = ts.length ? `<div class="block" id="${esc(g)}-ts">
      <div class="bh"><span class="n">${pad(hl.length ? 2 : 1)}</span><h3>문제 해결</h3><p>${esc(t('label.problem'))} → ${esc(t('label.cause'))} → ${esc(t('label.solution'))} → ${esc(t('label.result'))}</p></div>
      <div class="ts-grid${ts.length > 1 ? ' many' : ''}">${ts.map((b, k) => {
        const rows = [['', 'label.problem', b.problem], ['', 'label.cause', b.cause], ['sol', 'label.solution', b.solution], ['res', 'label.result', b.result], ['', 'label.lesson', b.lesson]].filter((r) => r[2]);
        return `<article class="ts"><p class="no">문제 해결 ${pad(k + 1)}</p><h4>${rich(b.title)}</h4>
          <dl>${rows.map(([c, key, v]) => `<div${c ? ` class="${c}"` : ''}><dt>${esc(t(key))}</dt><dd>${rich(v)}</dd></div>`).join('')}</dl></article>`;
      }).join('')}</div></div>` : '';

    const rt = p.retro || {};
    const cols = [['ok', '이룬 것', rt.achieved], ['', '아쉬운 점', rt.regrets], ['', '다음에는', rt.plans]].filter((c) => (c[2] || []).length);
    const shots = p.screenshots || [];
    const nb = (hl.length ? 1 : 0) + (ts.length ? 1 : 0) + 1;
    const retroHtml = (cols.length || shots.length) ? `<div class="block" id="${esc(g)}-retro">
      <div class="bh"><span class="n">${pad(nb)}</span><h3>결과와 회고</h3><p>무엇을 이뤘고, 무엇이 아쉬웠고, 다음에는 어떻게 할지</p></div>
      ${cols.length ? `<div class="retro" style="--cols:${cols.length}">${cols.map(([c, h, list]) => `<div class="rcol ${c}"><h4>${h}</h4><ul>${list.map((x) => `<li>${rich(x)}</li>`).join('')}</ul></div>`).join('')}</div>` : ''}
      ${shots.length ? `<p class="shots-h">화면 ${shots.length}장 · 누르면 크게</p><div class="shots">${shots.map((s) => shotBtn(g + '-shots', srcOf(p, s.src), s.caption || p.title,
        `<img src="${esc(srcOf(p, s.src))}" alt="${esc(plain(s.caption || p.title))}" loading="lazy" decoding="async">`)).join('')}</div>` : ''}
    </div>` : '';

    const next = projects[i + 1];
    const toc = [hl.length && [`${g}-feat`, `핵심 기능 ${hl.length}`], ts.length && [`${g}-ts`, `문제 해결 ${ts.length}`], retroHtml && [`${g}-retro`, '결과와 회고'],
      isUrl(L.video) && ['', `▶ ${t('name.video')}`, L.video]].filter(Boolean);
    return `<section id="${esc(g)}" class="sec proj"><div class="wrap">
      <header class="proj-h">
        <p class="eyebrow">PROJECT ${pad(i + 1)} / ${pad(projects.length)}<span class="m">${esc(p.team?.type === 'team' ? `${t('name.team')}${p.team.size ? ' · ' + p.team.size : ''}` : t('name.solo'))}</span></p>
        <h2>${esc(p.title)}</h2>
        ${p.tagline ? `<p class="tagline">${rich(p.tagline)}</p>` : ''}
        ${toc.length ? `<nav class="ptoc" aria-label="${esc(p.title)} 안에서 바로 가기">${toc.map(([id, label, url]) => (url
          ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)} ↗${NEWTAB}</a>` : `<a href="#${esc(id)}">${esc(label)}</a>`)).join('')}</nav>` : ''}
      </header>
      ${ov}${feats}${tsHtml}${retroHtml}
      <nav class="pnext" aria-label="프로젝트 이동">
        <a class="tl" href="#top">↑ 프로젝트 한눈에 보기</a>
        ${next ? `<a class="tl" href="#p-${esc(next.id)}">다음 프로젝트 · ${esc(next.title)} ↓</a>` : '<a class="tl" href="#contact">연락처 ↓</a>'}
      </nav>
    </div></section>`;
  }

  function contact(prof, projects, t) {
    const links = (prof.links || []).filter((l) => isUrl(l.url));
    return `<section id="contact" class="sec contact"><div class="wrap">
      <header class="sec-h"><p class="eyebrow">CONTACT</p><h2>연락처</h2></header>
      <div class="ct">
        <div>
          ${prof.email ? `<a class="mail" href="mailto:${esc(prof.email)}">${esc(prof.email)}</a>` : ''}
          ${isUrl(prof.github) ? `<p class="gh"><a href="${esc(prof.github)}" target="_blank" rel="noopener">GitHub · ${esc(shortUrl(prof.github))} ↗${NEWTAB}</a></p>` : ''}
          ${links.map((l) => `<p class="gh"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} · ${esc(shortUrl(l.url))} ↗${NEWTAB}</a></p>`).join('')}
          <div class="cta">
            ${prof.email ? `<a class="btn pri" href="mailto:${esc(prof.email)}">메일 보내기</a>` : ''}
            <button type="button" class="btn" data-pdf title="제출용 포트폴리오 문서(A4)를 PDF로 저장">${esc(t('name.portfolio'))} PDF</button>
          </div>
        </div>
        <ul class="plist">${projects.map((p) => `<li>
          <div><a class="t" href="#p-${esc(p.id)}">${esc(p.title)}</a><p class="s">${esc([metaOf(p, /장르/), metaOf(p, /인원/) || (p.team?.type === 'team' ? t('name.team') : t('name.solo'))].filter(Boolean).join(' · '))}</p></div>
          <div class="l">${[isUrl(p.links?.video) && out(p.links.video, esc(t('name.video')), 'tl'), out(docUrl(p), esc(t('name.doc-short')), 'tl'),
            out(deckUrl(p), esc(t('name.deck')), 'tl'), isUrl(p.links?.github) && out(p.links.github, 'GitHub', 'tl')].filter(Boolean).join('')}</div>
        </li>`).join('')}</ul>
      </div>
    </div></section>
    <footer class="foot"><div class="wrap">© ${esc(prof.name)} · 이 포트폴리오의 <a href="retro.html">레트로 게임풍 버전</a>도 있습니다</div></footer>`;
  }

  function topbar(prof, projects, t) {
    return `<header class="top"><div class="wrap top-in">
      <a class="brand" href="#top"><b>${esc(prof.name)}</b>${prof.job ? `<span>${esc(prof.job)}</span>` : ''}</a>
      <nav class="tnav" aria-label="절 이동">
        <a href="#about">${esc(t('page.intro'))}</a>
        ${projects.map((p) => `<a href="#p-${esc(p.id)}">${esc(p.title)}</a>`).join('')}
        <a href="#contact">연락처</a>
      </nav>
      <button type="button" class="btn sm" data-pdf title="제출용 포트폴리오 문서(A4)를 PDF로 저장">${esc(t('name.portfolio'))} PDF</button>
    </div></header>`;
  }

  // 지금 보고 있는 절을 머리 막대에 표시
  function watchActive() {
    const links = new Map([...document.querySelectorAll('.tnav a')].map((a) => [a.getAttribute('href').slice(1), a]));
    if (!('IntersectionObserver' in window) || !links.size) return;
    const io = new IntersectionObserver((ents) => ents.forEach((e) => {
      if (!e.isIntersecting) return;
      links.forEach((a, id) => a.classList.toggle('on', id === e.target.id));
    }), { rootMargin: '-35% 0px -60% 0px' });
    document.querySelectorAll('main > section[id]').forEach((s) => io.observe(s));
  }

  async function auditOut() {
    if (!new URLSearchParams(location.search).has('pf-audit')) return;
    const imgs = [...document.images];
    imgs.forEach((i) => { i.loading = 'eager'; });
    await waitMax(Promise.all(imgs.map((i) => (i.complete ? null : new Promise((r) => { i.addEventListener('load', r, { once: true }); i.addEventListener('error', r, { once: true }); })))), 20000);
    const pre = document.createElement('pre');
    pre.id = 'pf-audit'; pre.hidden = true;
    pre.textContent = btoa(unescape(encodeURIComponent(JSON.stringify({ ready: 'yes', ...PFPage.report() }))));
    document.body.appendChild(pre);
  }

  (async () => {
    const app = document.getElementById('app');
    try {
      if (location.protocol === 'file:') throw new Error('파일을 더블클릭해 열면 데이터를 읽지 못합니다. 로컬 서버(python -m http.server 4600)로 열어 주세요');
      const [t, pf] = await Promise.all([loadStrings(), fetch('data/portfolio.json', { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error(`data/portfolio.json (HTTP ${r.status})`); return r.json(); })]);
      const projects = (await Promise.all((pf.projects || []).map((id) => fetch(`data/projects/${encodeURIComponent(id)}.json`, { cache: 'no-cache' })
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
        .catch((err) => { info.errors.push(`data/projects/${id}.json: ${err.message}`); return null; })))).filter(Boolean);
      const prof = pf.profile || {};
      const byId = Object.fromEntries(projects.map((p) => [p.id, p]));
      document.title = `${prof.name ? prof.name + ' · ' : ''}${t('name.portfolio')}`;
      app.innerHTML = topbar(prof, projects, t)
        + `<main id="main">${hero(pf, prof, projects, t)}${about(pf, prof, byId, t)}${projects.map((p, i) => project(p, i, projects, t)).join('')}${contact(prof, projects, t)}</main>`;
      watchActive();
      // 주소에 #절 이 있으면 그려진 뒤 그 절로
      if (location.hash) requestAnimationFrame(() => document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView({ block: 'start' }));
    } catch (err) {
      info.errors.push(String(err && err.message || err));
      app.innerHTML = `<p class="loading">데이터를 읽지 못했습니다. ${esc(err && err.message || err)}</p>`;
    }
    document.documentElement.dataset.pfReady = 'yes';
    resolveReady();
    auditOut();
  })();
})();
</script>
</body>
</html>
